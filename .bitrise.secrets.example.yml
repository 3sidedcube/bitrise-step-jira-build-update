# Copy to .bitrise.secrets.yml (gitignored) and fill in to run `bitrise run test`.
envs:
- JIRA_BASE_URL: https://your-site.atlassian.net
- JIRA_USER_EMAIL:
- JIRA_API_TOKEN:
- SANDBOX_ISSUE_KEY:      # e.g. ABC-1234, a ticket in a test project
- SANDBOX_TARGET_STATUS:  # e.g. In Review
- SANDBOX_RESET_STATUS:   # e.g. In Progress, reachable back from the target status
